[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# Скачивание манифеста, JRE, installer-jar
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
# "net" нужен для TcpStream в server_status.rs (пинг игрового сервера).
# Указан явно: он подтягивался транзитивно через reqwest, и смена его
# фич молча сломала бы сборку.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "io-util", "net"] }
futures-util = "0.3"
# Проверка контрольных сумм скачанных файлов (Adoptium даёт sha256, maven — sha1)
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
# Распаковка JRE (Adoptium раздаёт zip даже под Windows)
zip = "2"
# Human-readable ошибки с контекстом на русском без ручного enum
anyhow = "1"
# Читаемые метки времени в launcher.log для саппорта
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Офлайн-UUID (MD5 "OfflinePlayer:<ник>" -> UUID v3) и парсинг pack.toml
md5 = "0.7"
uuid = "1"
toml = "0.8"
